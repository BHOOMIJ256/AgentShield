[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentshield"
version = "0.0.1"
description = "Provenance-aware runtime authorization and audit for AI agents."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=42"]
mcp = ["mcp>=2.3"]
dev = ["pytest>=8", "cryptography>=42", "mcp>=2.3"]

[project.scripts]
agentshield-mcp-proxy = "agentshield.adapters.mcp_proxy:main"
agentshield-approve = "agentshield.adapters.approval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentshield"]

[tool.pytest.ini_options]
testpaths = ["tests"]
